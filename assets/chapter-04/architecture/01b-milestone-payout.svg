ze="19.6875" lengthAdjust="spacing" textLength="860.0977" x="22.3125" y="382.5438">The reviewer may approve directly or request a correction. A progress notice does not gate review.</text><text fill="#000000" font-family="sans-serif" font-size="19.6875" lengthAdjust="spacing" textLength="862.3087" x="22.3125" y="407.3069">Success and failure are alternative provider outcomes. Repeated confirmations must not pay twice.</text><text fill="#000000" font-family="sans-serif" font-size="19.6875" lengthAdjust="spacing" textLength="5.4698" x="22.3125" y="432.0701">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="19.6875" lengthAdjust="spacing" textLength="1045.0621" x="22.3125" y="456.8333">The Angular demo records review, verified and accepted. Spring persists evidence status with SaveEvidenceCommand.</text><text fill="#000000" font-family="sans-serif" font-size="19.6875" lengthAdjust="spacing" textLength="1035.2568" x="22.3125" y="481.5965">The real provider transfer and correction cycle remain target behavior; an accepted item does not prove a bank payout.</text></g><?plantuml-src fLPDR-Cs4BtxLmomjw3rviFn9cqQmB4jeEWcIEtsrWiZZMJ25AcIb0qN-L-zzvTrXfHaQUF51YsG805dEFFUp9kXt5RgIbXHmej8juKrjSxcHXaB-utqE7ATtMr4PlPI5v0BvVgM37DHAvyOxPz4YR0MsgtHoloqprh-XN1ntJD-nW9rzl0D08sNiHdQwF7X-jFqTlesqkaiMINXud8wyj8hX9bIbV2uXLTub0gTDne1Tp93dI88dK4ctKjj7PQe_H_wpb707ouczmjqij3VVyOTAbZkoBZsnfPSc7_-1YziWHvUQYSrEWUvCdi-_trzFe6F_ESg_BcStdtaYFSZ5I13Ie7GZbv_WhN72bxlFYJ9ydnvUmzdPxEKCW3zU2kB0ktP6TiNjyk7967xt9Gb8Ox7IPASFqp3jQAmM139rh2OpEPiU6ZH8SEFrkNDuYQvPkkpKJ8zDAUJv79vnQU_rcWF1DsYoA0q6Ihs6BsIwQAD7_4cmfPe-mZNzKifFPHlwzp3-_WLQmIzRCzSYEKnwuCcS3M2to2GP4h8gLIMek1-t2VHnOWs-3FSYXmkXnoUZ9UvJ8MNHaCL2j8d5Co7a92efXkXVP_A0fNSSRbw19wjeMvGpJNT9GnPz1doQEBkfT-OcbIaJBfbOPqWynJ3E2zyxHeILqCIZpreBV8L4cldGK1ghCKq47nt5-R7EpO66k9VeQ-j1cz2QV8e19c3rAxEgPwIv3PWCGWe76C9J2Rlb1GNnX66_o4eQiefIQtGLAW33yTBhHFl0F_gJVu0__hRZPXLbJMxADhZO9o4tqDzF1Jn_W3pB4snya3AAkIBEl8UG9wr5uzPUTk9aZQlXwoRYEcGmmeLDGXF34ChAMRIeQh4WHNSu_F