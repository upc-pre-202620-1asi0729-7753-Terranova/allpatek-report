5729" x="614.6875" y="266.17">notes: TEXT</text><text fill="#000000" font-family="sans-serif" font-size="21.875" lengthAdjust="spacing" textLength="265.0314" x="614.6875" y="293.6847">file_name: VARCHAR(240)</text><text fill="#000000" font-family="sans-serif" font-size="21.875" lengthAdjust="spacing" textLength="189.6332" x="614.6875" y="321.1993">image: LONGTEXT</text><text fill="#000000" font-family="sans-serif" font-size="21.875" lengthAdjust="spacing" textLength="261.3678" x="614.6875" y="348.714">*created_at: DATETIME(6)</text><text fill="#000000" font-family="sans-serif" font-size="21.875" lengthAdjust="spacing" textLength="267.4774" x="614.6875" y="376.2286">*updated_at: DATETIME(6)</text></g><!--class parcel--><g class="entity" data-qualified-name="parcel" data-source-line="25" id="ent0003"><rect fill="#EAF2EB" height="81.2793" rx="3.6458" ry="3.6458" style="stroke:#181818;stroke-width:0.7292;" width="272.8116" x="8.75" y="189.7428"/><text fill="#000000" font-family="sans-serif" font-size="21.875" lengthAdjust="spacing" textLength="70.517" x="109.8973" y="219.7426">parcels</text><line style="stroke:#181818;stroke-width:0.7292;" x1="10.2083" x2="280.1033" y1="231.8408" y2="231.8408"/><text fill="#000000" font-family="sans-serif" font-size="21.875" lengthAdjust="spacing" textLength="255.3116" x="17.5" y="260.3823">*id: VARCHAR(160) &#171;PK&#187;</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="30" id="ent0006"><path d="M427.2917,414.3262 L427.2917,566.4827 A0,0 0 0 0 427.2917,566.4827 L1069.5301,566.4827 A0,0 0 0 0 1069.5301,566.4827 L1069.5301,428.9095 L1054.9468,414.3262 L753.9583,414.3262 L748.125,387.5834 L742.2917,414.3262 L427.2917,414.3262 A0,0 0 0 0 427.2917,414.3262" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.7292;"/><path d="M1054.9468,414.3262 L1054.9468,428.9095 L1069.5301,428.9095 L1054.9468,414.3262" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.7292;"/><text fill="#000000" font-family="sans-serif" font-size="21.875" lengthAdjust="spacing" textLength="611.6135" x="436.0417" y="444.326">The physical naming strategy pluralizes evidence to evidences.</text><text fill="#000000" font-family="sans-serif" font-size="21.875" lengthAdjust="spacing" textLength="385.4187" x="436.0417" y="471.8406">The REST resource is /api/v1/evidence.</text><text fill="#000000" font-family="sans-serif" font-size="21.875" lengthAdjust="spacing" textLength="355.6396" x="436.0417" y="499.3553">status = review, verified or accepted.</text><text fill="#000000" font-family="sans-serif" font-size="21.875" lengthAdjust="spacing" textLength="604.2969" x="436.0417" y="526.8699">The domain checks milestone 1 to 4; this column is an integer.</text><text fill="#000000" font-family="sans-serif" font-size="21.875" lengthAdjust="spacing" textLength="421.9376" x="436.0417" y="554.3846">Climate readings are calculated on request.</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" data-link-type="crowfoot" id="lnk4"><line style="stroke:#476050;stroke-width:1.4583;" x1="287.4449" x2="287.4449" y1="236.4095" y2="224.7428"/><line style="stroke:#476050;stroke-width:1.4583;" x1="291.8199" x2="291.8199" y1="236.4095" y2="224.7428"/><line style="stroke:#476050;stroke-width:1.4583;" x1="293.2782" x2="281.6116" y1="230.5762" y2="230.5762"/><line style="stroke:#476050;stroke-width:1.4583;" x1="594.1619" x2="605.8286" y1="230.5762" y2="221.8262"/><line style="stroke:#476050;stroke-width:1.4583;" x1="594.1619" x2="605.8286" y1="230.5762" y2="239.3262"/><line style="stroke:#476050;stroke-width:1.4583;" x1="594.1619" x2="605.8286" y1="230.5762" y2="230.5762"/><ellipse cx="585.4119" cy="230.5762" fill="none" rx="5.8333" ry="5.8333" style="stroke:#476050;stroke-width:1.4583;"/><path d="M293.2782,230.5762 C389.882,230.5762 481.6862,230.5762 579.5786,230.5762" fill="none" style="stroke:#476050;stroke-width:1.4583;stroke-dasharray:10.2083,10.2083;"/><text fill="#000000" font-family="sans-serif" font-size="21.