al amount.</text><text fill="#000000" font-family="sans-serif" font-size="21.875" lengthAdjust="spacing" textLength="538.6078" x="17.5" y="460.174">No full card number, security code or movement ledger.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk4"><polygon fill="#476050" points="723.2532,224.7428,710.1282,218.9095,715.9615,224.7428,710.1282,230.5762,723.2532,224.7428" style="stroke:#476050;stroke-width:1.4583;"/><path d="M435.6693,224.7428 C527.0435,224.7428 634.6966,224.7428 714.5032,224.7428" fill="none" style="stroke:#476050;stroke-width:1.4583;stroke-dasharray:10.2083,10.2083;"/><text fill="#000000" font-family="sans-serif" font-size="21.875" lengthAdjust="spacing" textLength="88.7711" x="606.6667" y="218.2843">profile_id</text></g><g class="legend" data-source-line="32"><rect fill="none" height="65.944" rx="10.9375" ry="10.9375" style="stroke:#000000;stroke-width:1.4583;" width="667.0992" x="121.4504" y="481.4095"/><text fill="#000000" font-family="sans-serif" font-size="20.4167" lengthAdjust="spacing" textLength="400.9163" x="128.7421" y="509.8954">PK: primary key | UQ: unique | *: NOT NULL</text><text fill="#000000" font-family="sans-serif" font-size="20.4167" lengthAdjust="spacing" textLength="652.5159" x="128.7421" y="535.5758">Dashed arrows are logical references; MySQL has no foreign keys here.</text></g><?plantuml-src RLFHJjj047ptLspXXQ8s2bL29HT5CX3QY9022UqZsjojxLFET-xTcJIb-VUkSGesui7ohMPsRtOyVbSwp0e4ZHjR1V051JGO-PKo9JeiO8bYbJbR6NbcjNMmpbMW5YufnKg72sl230k2EHe_9wVIjpbpzOVWQDW2VOxIhfN984NjswE5Hk-J49nQLe4cmfgdxdwBaZXdrusm_S7du_wm3SfImT6W7-LA4l1YkPM-AOHoGbCKLD04YTOb1bh1NxZQp6-cy17EgR3m4xMcu2DDQO1WmQai3o2L8n6KDH4Pxj_0thhXxG5wQCxm604yfegqtC8XA1d3Z-Jsx5joUt1qt7yF9oVNbwDHXrCwcofDzpNtTF9rCbjqO5kIOOlk1L_gOtWDvrPBSjrREWHsCWnUy44NfT-bSfiNUDY5bmvDQuN1gzd24Tidxp74S9uinel9rVZWkCkfIlacP_liuiw0niPT0VlZvEBJ-FGDFnkF_ZkvZNR6ztgZv-QuPMfaR21OsX1i0JRTVIUUEW_MaOS2_Oea27IoJWgoMWJUcXzGHWM56h3Wlo3qk6bc8QsqRkYcAfRaF